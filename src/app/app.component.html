<div class="app-shell">
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__mark" aria-hidden="true">VD</span>
      <span class="app-header__names">
        <span class="app-header__title">VDSP</span>
        <span class="app-header__subtitle">Vehicle Dynamics Simulation Platform</span>
      </span>
    </div>

    <div class="app-header__actions">
      <div class="segmented" role="group" aria-label="Colour theme">
        <button
          *ngFor="let option of themeOptions"
          type="button"
          class="segmented__btn app-header__theme-btn"
          [class.is-active]="themePreference === option.value"
          [attr.aria-pressed]="themePreference === option.value"
          [attr.title]="option.label + ' theme'"
          (click)="setTheme(option.value)"
        >
          <app-icon [name]="option.icon" [size]="14"></app-icon>
          <span class="app-header__theme-label">{{ option.label }}</span>
        </button>
      </div>
    </div>
  </header>

  <app-track-view></app-track-view>
</div>
