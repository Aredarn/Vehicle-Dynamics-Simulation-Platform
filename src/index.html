<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VDSP — Vehicle Dynamics Simulation</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Resolve the theme before first paint. ThemeService applies the same value once Angular
    // boots; doing it here as well avoids a flash of the wrong theme while the bundle loads.
    (function () {
      try {
        var stored = localStorage.getItem('vdsp.theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
