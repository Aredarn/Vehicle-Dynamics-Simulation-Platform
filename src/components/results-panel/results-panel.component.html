<aside class="results-panel">
  <div class="panel-header">
    <div class="panel-header__icon">📊</div>
    <div>
      <div class="panel-header__title">Results</div>
      <div class="panel-header__subtitle">AI training history</div>
    </div>
  </div>

  <ng-container *ngIf="runs.length; else emptyState">
    <div class="runs-list">
      <section *ngFor="let run of runs" class="run-card">
        <div class="run-header" (click)="toggleRun(run)" role="button" tabindex="0">
          <div>
            <strong>{{ run.label }}</strong>
            <div class="run-meta">
              <span>{{ run.generationCount }} gens</span>
              <span>Best {{ run.bestLapTime.toFixed(1) }}s</span>
              <span>Fitness {{ run.bestFitness.toFixed(1) }}</span>
            </div>
          </div>
          <div class="run-actions">
            <button type="button" class="run-export" (click)="exportRun(run); $event.stopPropagation()">Export</button>
            <span class="run-toggle">{{ isRunExpanded(run) ? '▾' : '▸' }}</span>
          </div>
        </div>

        <div class="run-entries" *ngIf="isRunExpanded(run)">
          <button
            *ngFor="let entry of run.entries"
            type="button"
            class="history-item"
            [class.selected]="entry.generation === selectedGeneration"
            (click)="selectEntry(entry)"
          >
            <div class="history-item__header">
              <span>Gen {{ entry.generation }}</span>
              <strong>{{ entry.bestLapTime.toFixed(1) }}s</strong>
            </div>
            <div class="history-item__meta">
              <span>Fitness: {{ entry.bestFitness.toFixed(1) }}</span>
              <span>Avg: {{ entry.averageFitness.toFixed(1) }}</span>
              <span>Alive: {{ entry.aliveCount }}</span>
            </div>
          </button>
        </div>
      </section>
    </div>
  </ng-container>

  <ng-template #emptyState>
    <div class="results-empty">
      <div class="results-empty__icon">🏎</div>
      <p class="results-empty__title">No results yet</p>
      <p class="results-empty__hint">Train the AI to generate a history of optimal paths here.</p>
    </div>
  </ng-template>
</aside>
